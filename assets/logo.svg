<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Body -->
  <ellipse cx="24" cy="27" rx="9" ry="12" fill="#f0b429"/>
  <!-- Stripes -->
  <rect x="15" y="24" width="18" height="3" rx="1" fill="#0d1117" opacity="0.5"/>
  <rect x="15" y="30" width="18" height="3" rx="1" fill="#0d1117" opacity="0.5"/>
  <!-- Head -->
  <circle cx="24" cy="14" r="6" fill="#f0b429"/>
  <!-- Eyes -->
  <circle cx="21.5" cy="13" r="1.5" fill="#0d1117"/>
  <circle cx="26.5" cy="13" r="1.5" fill="#0d1117"/>
  <!-- Antennae -->
  <line x1="21" y1="9"  x2="18" y2="5"  stroke="#f0b429" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="27" y1="9"  x2="30" y2="5"  stroke="#f0b429" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="17.5" cy="4.5" r="1.5" fill="#00bcd4"/>
  <circle cx="30.5" cy="4.5" r="1.5" fill="#00bcd4"/>
  <!-- Wings -->
  <ellipse cx="13" cy="20" rx="7" ry="4" fill="#00bcd4" opacity="0.7" transform="rotate(-20 13 20)"/>
  <ellipse cx="35" cy="20" rx="7" ry="4" fill="#00bcd4" opacity="0.7" transform="rotate(20 35 20)"/>
  <!-- Stinger -->
  <polygon points="24,39 21,36 27,36" fill="#ff4444"/>
</svg>
